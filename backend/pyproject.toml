[project]
name = "paragliding-weather-backend"
version = "0.1.0"
description = "FastAPI + Redis weather caching service"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "celery>=5.4.0",
    "boto3>=1.35.0",
    "sqlalchemy>=2.0.0",
    "psycopg[binary]>=3.2.0",
    "opencv-python-headless>=4.10.0",
    "uvicorn[standard]>=0.28.0",
    "redis>=5.0.3",
    "pydantic-settings>=2.2.1",
    "httpx>=0.27.0",
]

[tool.uv]
dev-dependencies = [
    "pytest>=8.1.1",
    "pytest-asyncio>=0.23.6",
]

[tool.ruff]
target-version = "py311"
line-length = 120